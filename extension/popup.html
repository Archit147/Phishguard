<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhishGuard</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app" id="app">

  <header class="bar">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2 4 5.5v6c0 5 3.4 9.2 8 10.5 4.6-1.3 8-5.5 8-10.5v-6L12 2Z"
              stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="m8.6 12.1 2.3 2.3 4.5-4.5" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>PhishGuard</span>
    </div>
    <div class="bar-right">
      <span class="dot" id="api-dot" title="Backend status"></span>
      <span class="api-label" id="api-label">checking</span>
    </div>
  </header>

  <!-- ---------------------------------------------------------- verdict --- -->
  <section class="hero" id="hero" data-state="loading">
    <div class="gauge-wrap">
      <svg class="gauge" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="g-track" cx="60" cy="60" r="50" fill="none" stroke-width="10"/>
        <circle class="g-fill"  cx="60" cy="60" r="50" fill="none" stroke-width="10"
                stroke-linecap="round" stroke-dasharray="314.16" stroke-dashoffset="314.16"/>
      </svg>
      <div class="gauge-center">
        <div class="score" id="score" role="status" aria-live="polite">--</div>
        <div class="score-cap">risk / 100</div>
      </div>
    </div>

    <div class="verdict-block">
      <div class="badge" id="badge">
        <span class="badge-dot"></span><span id="badge-text">Scanning</span>
      </div>
      <h1 class="headline" id="headline">Analysing this page&hellip;</h1>
      <div class="host" id="host" title=""></div>
    </div>
  </section>

  <p class="summary" id="summary">
    PhishGuard is inspecting the address, page structure, forms and scripts.
  </p>

  <!-- ------------------------------------------------------------ meta ---- -->
  <div class="meta" id="meta" hidden>
    <div class="meta-item"><span class="mk">Indicators</span><span class="mv" id="m-count">0</span></div>
    <div class="meta-item"><span class="mk">Confidence</span><span class="mv" id="m-conf">--</span></div>
    <div class="meta-item"><span class="mk">Scan time</span><span class="mv" id="m-time">--</span></div>
  </div>

  <!-- --------------------------------------------------------- signals ---- -->
  <section class="signals" id="signals-section" hidden>
    <button class="sig-toggle" id="sig-toggle" type="button" aria-expanded="false"
            aria-controls="signals-list">
      <span>Why this score</span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <ul class="sig-list" id="signals-list" hidden></ul>
  </section>

  <!-- --------------------------------------------------------- actions ---- -->
  <div class="actions">
    <button class="btn primary" id="rescan" type="button">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6" stroke="currentColor"
              stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span id="rescan-label">Re-scan page</span>
    </button>
    <button class="btn ghost" id="whitelist" type="button">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 2 4 5.5v6c0 5 3.4 9.2 8 10.5 4.6-1.3 8-5.5 8-10.5v-6L12 2Z"
              stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path d="M12 8.5v7M8.5 12h7" stroke="currentColor" stroke-width="2"
              stroke-linecap="round"/>
      </svg>
      <span id="whitelist-label">Whitelist this site</span>
    </button>
  </div>

  <!-- ------------------------------------------------------- whitelist ---- -->
  <section class="wl" id="wl-section">
    <button class="wl-toggle" id="wl-toggle" type="button" aria-expanded="false"
            aria-controls="wl-list">
      <span>Trusted sites <em id="wl-count">0</em></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="m6 9 6 6 6-6" stroke="currentColor" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <ul class="wl-list" id="wl-list" hidden></ul>
  </section>

  <footer class="foot">
    <span id="engine">engine --</span>
    <span class="sep">&middot;</span>
    <span>Blocks at score &ge; 60</span>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="popup.js"></script>
</body>
</html>
